# AI 会话归档钩子（AgentLedger / agent-session-commit）：
# 每次 commit 后，自动把新增的 AI 助手会话归档 amend 进同一个提交
# （.agent-sessions/bundles/），不产生额外的归档提交。
# 首次使用：安装并选择你的 AI 助手与会话目录，见 README「快速开始」第 3 步。
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, post-commit]

repos:
  - repo: https://github.com/Gentle-Lijie/AgentLedger
    rev: v0.1.3
    hooks:
      - id: agent-session-commit
